# ==================== AstroVoluntário - Configuração de TESTE ====================
spring.application.name=astro-voluntario

# ====================== Banco H2 em memória ======================
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ====================== JPA / Hibernate ======================
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# ====================== Flyway desabilitado nos testes ======================
spring.flyway.enabled=false

# ====================== JWT (valor dummy para os testes) ======================
jwt.secret=test-secret-key-with-at-least-32-bytes-for-hmac-sha256
jwt.expiration=86400000

# ====================== Logging ======================
logging.level.org.springframework=WARN
logging.level.org.hibernate=WARN
logging.level.com.astrovoluntario=INFO

# Boas práticas JPA (silenciar warning)
spring.jpa.open-in-view=false
